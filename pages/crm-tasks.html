<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-up Tasks — Taqwa Automobile Service Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- Hold the first paint until app.js has drawn the shell (marker at the end
       of <body>), so a page change never shows a frame without the sidebar
       and header. The browser keeps the previous page on screen meanwhile.
       Chromium releases the hold as soon as app.js inserts the shell (it
       contains images) and then logs "Did not find element expected to be
       parsed" -- a harmless warning; the marker must stay AFTER the scripts,
       because placed before app.js a frame can slip out before the shell. -->
  <link rel="expect" href="#shell-drawn" blocking="render">
  <!-- The sidebar logo and the header's avatar are drawn by app.js; fetch them
       alongside the scripts so they are ready in that first frame instead of
       popping in after it. -->
  <link rel="preload" href="../assets/logo/logo-white.png" as="image">
  <link rel="preload" href="../assets/avatar/admin.webp" as="image">
</head>
<body data-page="crm-tasks" data-root="../">

  <div id="page-content">

    <p class="page-subtitle">Follow-up tasks with due dates and status.</p>

    <!-- UI only: this Customer CRM page is a placeholder. It reads no records,
         has no forms and makes no requests of its own. -->
    <section class="card" aria-labelledby="crmSoonTitle">
      <div class="card__body">
        <div class="empty">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" aria-hidden="true"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          <h3 id="crmSoonTitle">Follow-up tasks are coming soon</h3>
          <p>This page will hold follow-up tasks for staff, each with a due date and status. It will be activated in a future release. No tasks are stored yet.</p>
          <span class="badge badge--info">Coming soon</span>
        </div>
      </div>
    </section>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <span id="shell-drawn" hidden></span>
</body>
</html>

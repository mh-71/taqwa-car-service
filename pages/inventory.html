<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Taqwa Automobile Service Center</title>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="inventory" data-root="../">

  <div id="page-content">

    <p class="page-subtitle">Spare parts, stock levels and movement history — every stock change is recorded as an auditable transaction.</p>

    <section class="stats-grid stats-grid--wide" id="invStats" aria-label="Inventory summary"></section>

    <div class="toolbar">
      <input type="search" class="input toolbar__search" id="invSearch"
             placeholder="Search part, SKU, brand, location…" aria-label="Search parts">
      <select class="select" id="invCategory" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>
      <select class="select" id="invBrand" aria-label="Filter by brand">
        <option value="all">All brands</option>
      </select>
      <select class="select" id="invStockStatus" aria-label="Filter by stock status">
        <option value="all">Any stock level</option>
        <option value="Normal">Normal</option>
        <option value="Low Stock">Low Stock</option>
        <option value="Out of Stock">Out of Stock</option>
      </select>
      <select class="select" id="invStatus" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option>Active</option>
        <option>Inactive</option>
      </select>
      <select class="select" id="invSort" aria-label="Sort parts">
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="partno">Part No.</option>
        <option value="stock-asc">Stock low–high</option>
        <option value="stock-desc">Stock high–low</option>
        <option value="price-asc">Selling price low–high</option>
        <option value="price-desc">Selling price high–low</option>
        <option value="value-desc">Stock value high–low</option>
        <option value="updated-desc">Recently updated</option>
      </select>
      <span class="toolbar__count" id="invCount"></span>
      <span class="spacer"></span>
      <button class="btn btn--ghost" id="receiveStockBtn">Receive Stock</button>
      <button class="btn btn--primary" id="addPartBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Part
      </button>
    </div>

    <section class="card">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>Part</th><th>Part No.</th><th>Category</th>
              <th class="num">Stock</th><th class="num">Min</th>
              <th class="num">Purchase</th><th class="num">Selling</th>
              <th class="num">Stock Value</th><th>Stock Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="invTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/inventory.js"></script>
</body>
</html>

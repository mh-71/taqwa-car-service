<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Cards — Taqwa Automobile Service Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- Hold the first paint until app.js has drawn the shell (marker at the end
       of <body>), so a page change never shows a frame without the sidebar
       and header. The browser keeps the previous page on screen meanwhile.
       Chromium releases the hold as soon as app.js inserts the shell (it
       contains images) and then logs "Did not find element expected to be
       parsed" -- a harmless warning; the marker must stay AFTER the scripts,
       because placed before app.js a frame can slip out before the shell. -->
  <link rel="expect" href="#shell-drawn" blocking="render">
  <!-- The sidebar logo and the header's avatar are drawn by app.js; fetch them
       alongside the scripts so they are ready in that first frame instead of
       popping in after it. -->
  <link rel="preload" href="../assets/logo/logo-white.png" as="image">
  <link rel="preload" href="../assets/avatar/admin.webp" as="image">
</head>
<body data-page="job-cards" data-root="../">

  <div id="page-content">

    <p class="page-subtitle">The workshop's central operational record — services, parts, labour, inspection, and totals per job.</p>

    <section class="stats-grid stats-grid--wide" id="jobStats" aria-label="Job cards summary"></section>

    <div class="toolbar">
      <input type="search" class="input toolbar__search" id="jobSearch"
             placeholder="Search job, customer, reg no, mechanic…" aria-label="Search job cards">
      <select class="select" id="jobQuick" aria-label="Quick filter">
        <option value="all">All jobs</option>
        <option value="today">Today</option>
        <option value="active">Active</option>
        <option value="waiting">Waiting</option>
        <option value="done">Completed / Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select class="select" id="jobStatus" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option>Received</option><option>Inspection</option><option>Waiting for Approval</option>
        <option>In Progress</option><option>Waiting for Parts</option>
        <option>Completed</option><option>Delivered</option><option>Cancelled</option>
      </select>
      <select class="select" id="jobPriority" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="low">Low</option><option value="normal">Normal</option>
        <option value="high">High</option><option value="urgent">Urgent</option>
      </select>
      <select class="select" id="jobMechanic" aria-label="Filter by mechanic">
        <option value="all">All mechanics</option>
      </select>
      <input type="date" class="input" id="jobDate" aria-label="Filter by date">
      <select class="select" id="jobSort" aria-label="Sort job cards">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="id">Job ID</option>
        <option value="customer">Customer A–Z</option>
        <option value="status">Status</option>
        <option value="priority">Priority</option>
        <option value="total-desc">Total high–low</option>
      </select>
      <span class="toolbar__count" id="jobCount"></span>
      <span class="spacer"></span>
      <button class="btn btn--primary" id="addJobBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        New Job Card
      </button>
    </div>

    <section class="card">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>Date</th><th>Customer</th><th>Vehicle</th><th>Mechanic</th>
              <th>Services</th><th>Status</th><th>Priority</th><th class="num">Total</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="jobTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Print-only area, populated by job-cards.js before window.print() -->
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/job-cards.js"></script>
  <span id="shell-drawn" hidden></span>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Taqwa Automobile Service Center</title>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="reports" data-root="../">

  <div id="page-content">

    <p class="page-subtitle">Read-only business reports built from your existing Job Card, Invoice, Payment, Expense and Inventory records.</p>

    <div class="toolbar">
      <select class="select" id="repType" aria-label="Report type">
        <option value="revenue">Revenue Report</option>
        <option value="expense">Expense Report</option>
        <option value="net">Net Result</option>
        <option value="payment">Payment Report</option>
        <option value="invoice">Invoice Report</option>
        <option value="jobcard">Job Card Report</option>
        <option value="inventory">Inventory / Parts Report</option>
        <option value="customer">Customer Report</option>
        <option value="mechanic">Mechanic Report</option>
        <option value="service">Service Performance Report</option>
      </select>
      <select class="select" id="repRange" aria-label="Date range">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="week">This Week</option>
        <option value="month" selected>This Month</option>
        <option value="lastmonth">Last Month</option>
        <option value="custom">Custom Range…</option>
      </select>
      <div class="field" id="repCustomWrap" style="margin:0" hidden>
        <input type="date" class="input" id="repFrom" aria-label="From date">
      </div>
      <div class="field" id="repCustomWrapTo" style="margin:0" hidden>
        <input type="date" class="input" id="repTo" aria-label="To date">
      </div>
      <span class="toolbar__count" id="repRangeLabel"></span>
      <span class="spacer"></span>
      <button class="btn btn--ghost" id="printReportBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 8H5c-1.7 0-3 1.3-3 3v6h4v4h12v-4h4v-6c0-1.7-1.3-3-3-3zm-3 11H8v-5h8v5zm3-7c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-1-9H6v4h12V3z"/></svg>
        Print Report
      </button>
    </div>

    <div id="reportContent"></div>

  </div>

  <!-- Print-only area, populated by reports.js before window.print() -->
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>

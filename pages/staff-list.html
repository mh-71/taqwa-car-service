<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff List — Taqwa Automobile Service Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/staff.css">
  <link rel="stylesheet" href="../css/staff-list.css">
  <!-- Hold the first paint until app.js has drawn the shell (marker at the end
       of <body>), so a page change never shows a frame without the sidebar
       and header. The browser keeps the previous page on screen meanwhile.
       Chromium releases the hold as soon as app.js inserts the shell (it
       contains images) and then logs "Did not find element expected to be
       parsed" -- a harmless warning; the marker must stay AFTER the scripts,
       because placed before app.js a frame can slip out before the shell. -->
  <link rel="expect" href="#shell-drawn" blocking="render">
  <!-- The sidebar logo and the header's avatar are drawn by app.js; fetch them
       alongside the scripts so they are ready in that first frame instead of
       popping in after it. -->
  <link rel="preload" href="../assets/logo/logo-white.png" as="image">
  <link rel="preload" href="../assets/avatar/admin.webp" as="image">
</head>
<body data-page="staff-list" data-root="../">

  <div id="page-content">

    <!-- Staff List. Filled in by js/staff-list.js from the workshop database
         (GET /api/staff) and nothing else: with no database, a failed read or
         a signed-out browser, the table says so and shows no one. -->

    <nav class="stf-crumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="staff-management.html">Staff Management</a></li>
        <li aria-current="page">Staff List</li>
      </ol>
    </nav>
    <div class="stf-head">
      <p class="page-subtitle">Every employee in the workshop database: mechanics and all other staff.</p>
      <div class="stf-head__actions"><button type="button" class="btn btn--primary" id="stlAdd" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Add Staff</span></button></div>
    </div>
    <div class="toolbar stf-toolbar stl-toolbar" role="search" aria-label="Find staff">
      <input type="search" class="input toolbar__search" id="stlSearch" placeholder="Search name, ID, code, phone, email&#8230;" aria-label="Search staff" autocomplete="off" maxlength="100" disabled>
      <select class="select" id="stlDesignation" aria-label="Filter by designation" disabled><option value="all">All designations</option></select>
      <select class="select" id="stlDepartment" aria-label="Filter by department" disabled><option value="all">All departments</option></select>
      <select class="select" id="stlStatus" aria-label="Filter by status" disabled><option value="all">All statuses</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
      <select class="select" id="stlSort" aria-label="Sort staff" disabled>
        <option value="name-asc">Name (A&#8211;Z)</option>
        <option value="name-desc">Name (Z&#8211;A)</option>
        <option value="joined-desc">Joining date (newest)</option>
        <option value="joined-asc">Joining date (oldest)</option>
        <option value="status">Status (Active first)</option>
      </select>
      <button type="button" class="btn btn--ghost btn--sm" id="stlClear" disabled>Clear filters</button>
      <span class="toolbar__count" id="stlCount" aria-live="polite"></span>
    </div>
    <section class="card stf-table-card" aria-labelledby="stlTitle">
      <div class="card__head">
        <h2 id="stlTitle">Staff</h2>
      </div>
      <div class="table-wrap">
        <table class="table table--compact stf-table stl-table" id="stlTable" aria-describedby="stlCount" aria-busy="true">
          <caption class="stl-sr-only">Staff members</caption>
          <thead>
            <tr><th scope="col">Staff ID / Code</th><th scope="col">Name</th><th scope="col">Designation</th><th scope="col">Department</th><th scope="col">Phone</th><th scope="col">Email</th><th scope="col">Status</th><th scope="col">Joining Date</th><th scope="col"><span class="stl-sr-only">Actions</span></th></tr>
          </thead>
          <tbody id="stlBody"></tbody>
        </table>
      </div>
      <div class="card__body stf-card-foot" id="stlFoot" hidden>
        <div class="stf-pager" role="navigation" aria-label="Staff list pages">
          <span class="stf-pager__range" id="stlRange" aria-live="polite"></span>
          <div class="stf-pager__btns">
            <label class="stl-pagesize"><span>Rows per page</span>
              <select class="select" id="stlPageSize"><option value="10">10</option><option value="25" selected>25</option><option value="50">50</option><option value="100">100</option></select>
            </label>
            <button type="button" class="btn btn--ghost btn--sm" id="stlPrev"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg><span>Previous</span></button>
            <button type="button" class="btn btn--ghost btn--sm" id="stlNext"><span>Next</span><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/staff-list.js"></script>
  <span id="shell-drawn" hidden></span>
</body>
</html>

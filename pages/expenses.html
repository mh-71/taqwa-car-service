<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — Taqwa Automobile Service Center</title>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="expenses" data-root="../">

  <div id="page-content">

    <p class="page-subtitle">Workshop operating costs — rent, utilities, wages, tools, and parts purchases — kept separate from revenue.</p>

    <section class="stats-grid" id="expStats" aria-label="Expenses summary"></section>

    <div class="toolbar">
      <input type="search" class="input toolbar__search" id="expSearch"
             placeholder="Search expense, description, category, payee…" aria-label="Search expenses">
      <select class="select" id="expStatus" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option>Active</option><option>Void</option>
      </select>
      <select class="select" id="expCategory" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>
      <select class="select" id="expMethod" aria-label="Filter by method">
        <option value="all">All methods</option>
        <option>Cash</option><option>Card</option><option>Mobile Banking</option><option>Bank Transfer</option>
      </select>
      <input type="date" class="input" id="expDate" aria-label="Filter by date">
      <select class="select" id="expSort" aria-label="Sort expenses">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="id">Expense ID</option>
        <option value="category">Category A–Z</option>
        <option value="amount-desc">Amount high–low</option>
        <option value="amount-asc">Amount low–high</option>
      </select>
      <span class="toolbar__count" id="expCount"></span>
      <span class="spacer"></span>
      <button class="btn btn--primary" id="addExpenseBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Expense
      </button>
    </div>

    <section class="card">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Expense #</th><th>Date</th><th>Category</th><th>Description</th><th>Payee</th>
              <th>Method</th><th class="num">Amount</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="expTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Print-only area, populated by expenses.js before window.print() -->
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/expenses.js"></script>
</body>
</html>

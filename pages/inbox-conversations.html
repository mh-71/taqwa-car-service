<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Conversations — Taqwa Automobile Service Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/inbox-conversations.css">
  <!-- Hold the first paint until app.js has drawn the shell (marker at the end
       of <body>), so a page change never shows a frame without the sidebar
       and header. The browser keeps the previous page on screen meanwhile.
       Chromium releases the hold as soon as app.js inserts the shell (it
       contains images) and then logs "Did not find element expected to be
       parsed" -- a harmless warning; the marker must stay AFTER the scripts,
       because placed before app.js a frame can slip out before the shell. -->
  <link rel="expect" href="#shell-drawn" blocking="render">
  <!-- The sidebar logo and the header's avatar are drawn by app.js; fetch them
       alongside the scripts so they are ready in that first frame instead of
       popping in after it. -->
  <link rel="preload" href="../assets/logo/logo-white.png" as="image">
  <link rel="preload" href="../assets/avatar/admin.webp" as="image">
</head>
<body data-page="inbox-conversations" data-root="../">

  <div id="page-content">

    <!-- All Conversations. Filled in by js/inbox-conversations.js. Facebook Messenger is the one
         connected channel: its conversations are read from the workshop database
         (GET /api/messenger/conversations). WhatsApp and Website Forms are not connected, so they
         show that plainly and list nothing; no sample conversation is ever shown here. -->

    <div class="inb-head">
      <span class="inb-head__icon"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></span>
      <div class="inb-head__text">
        <h2 class="inb-head__title">All Conversations</h2>
        <p class="page-subtitle">Customer conversations from every connected channel, newest first.</p>
      </div>
    </div>

    <div class="inb-toolbar" role="search" aria-label="Find conversations">
      <div class="inb-channels" role="group" aria-label="Filter by channel">
        <button type="button" class="inb-chip is-active" data-channel="all" aria-pressed="true">All</button>
        <button type="button" class="inb-chip" data-channel="Facebook" aria-pressed="false">Facebook <span class="inb-chip__n" id="inbCountFacebook"></span></button>
        <button type="button" class="inb-chip" data-channel="WhatsApp" aria-pressed="false">WhatsApp <span class="inb-chip__tag">Not connected</span></button>
        <button type="button" class="inb-chip" data-channel="Website" aria-pressed="false">Website <span class="inb-chip__tag">Not connected</span></button>
      </div>
      <div class="inb-tools">
        <label class="inb-search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="search" class="input" id="inbSearch" placeholder="Search name or message&#8230;" aria-label="Search by customer name or message" maxlength="100" autocomplete="off">
        </label>
        <select class="select" id="inbStatus" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="unread">Unread</option>
          <option value="Open">Open</option>
          <option value="Pending">Pending</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>
    </div>

    <section class="card inb-card" aria-labelledby="inbListTitle">
      <h3 class="inb-sr-only" id="inbListTitle">Conversations</h3>
      <div class="inb-notes" id="inbNotes"></div>
      <div class="inb-state" id="inbState" role="status" aria-live="polite"></div>
      <ul class="inb-list" id="inbList" aria-labelledby="inbListTitle" hidden></ul>
      <div class="inb-foot" id="inbFoot" hidden>
        <span id="inbCount" aria-live="polite"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="inbMore" hidden>Load more</button>
      </div>
    </section>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/inbox-conversations.js"></script>
  <span id="shell-drawn" hidden></span>
</body>
</html>

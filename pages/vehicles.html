<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles — Taqwa Automobile Service Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- Hold the first paint until app.js has drawn the shell (marker at the end
       of <body>), so a page change never shows a frame without the sidebar
       and header. The browser keeps the previous page on screen meanwhile.
       Chromium releases the hold as soon as app.js inserts the shell (it
       contains images) and then logs "Did not find element expected to be
       parsed" -- a harmless warning; the marker must stay AFTER the scripts,
       because placed before app.js a frame can slip out before the shell. -->
  <link rel="expect" href="#shell-drawn" blocking="render">
  <!-- The sidebar logo and the header's avatar are drawn by app.js; fetch them
       alongside the scripts so they are ready in that first frame instead of
       popping in after it. -->
  <link rel="preload" href="../assets/logo/logo-white.png" as="image">
  <link rel="preload" href="../assets/avatar/admin.webp" as="image">
</head>
<body data-page="vehicles" data-root="../">

  <div id="page-content">

    <div class="toolbar">
      <input type="search" class="input toolbar__search" id="vehSearch"
             placeholder="Search reg no, customer, brand, VIN…" aria-label="Search vehicles">
      <select class="select" id="vehBrand" aria-label="Filter by brand">
        <option value="all">All brands</option>
      </select>
      <select class="select" id="vehFuel" aria-label="Filter by fuel type">
        <option value="all">All fuel types</option>
        <option>Petrol</option><option>Octane</option><option>Diesel</option>
        <option>CNG</option><option>CNG + Octane</option><option>Hybrid</option><option>Electric</option>
      </select>
      <select class="select" id="vehService" aria-label="Filter by service status">
        <option value="all">Any service status</option>
        <option value="due">Service due</option>
        <option value="upcoming">Upcoming service</option>
        <option value="none">No service history</option>
      </select>
      <select class="select" id="vehStatus" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option>Active</option>
        <option>Inactive</option>
      </select>
      <select class="select" id="vehSort" aria-label="Sort vehicles">
        <option value="added-desc">Newest first</option>
        <option value="added-asc">Oldest first</option>
        <option value="reg">Registration A–Z</option>
        <option value="customer">Customer A–Z</option>
        <option value="mileage-desc">Mileage high–low</option>
        <option value="last-service">Last service (recent)</option>
        <option value="next-service">Next service (soonest)</option>
      </select>
      <span class="toolbar__count" id="vehCount"></span>
      <span class="spacer"></span>
      <button class="btn btn--primary" id="addVehicleBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Vehicle
      </button>
    </div>

    <section class="card">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>Registration</th><th>Customer</th><th>Vehicle</th>
              <th class="num">Year</th><th class="num">Mileage</th>
              <th>Last Service</th><th>Next Service</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="vehTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/vehicles.js"></script>
  <span id="shell-drawn" hidden></span>
</body>
</html>
